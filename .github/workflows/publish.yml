name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set version from main commit count
        run: npm version --no-git-tag-version "1.0.$(git rev-list --count HEAD)"

      - name: Package
        run: npx vsce package --out quiet-clojure-syntax.vsix

      - name: Check Marketplace credentials
        id: marketplace-auth
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish
        if: steps.marketplace-auth.outputs.available == 'true'
        run: npx vsce publish --packagePath quiet-clojure-syntax.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
